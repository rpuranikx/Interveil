# Supply-chain defense: refuse package versions published less than 1 day ago.
minimumReleaseAge: 1440

packages:
  - interveil
  - interveil-vscode

autoInstallPeers: false

allowBuilds:
  '@vscode/vsce-sign': set this to true or false
  better-sqlite3: set this to true or false
  esbuild: true
  keytar: set this to true or false
