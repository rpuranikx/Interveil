# Supply-chain defense: refuse package versions published less than 1 day ago.
minimumReleaseAge: 1440

packages:
  - interveil
  - interveil-vscode

autoInstallPeers: false

# Only these dependencies may run install scripts.
# better-sqlite3 needs its native binding for persistent storage; esbuild ships a binary.
# keytar and @vscode/vsce-sign are only used when packaging the VS Code extension.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  keytar: false
  '@vscode/vsce-sign': false

# Security patches for transitive dependencies (pnpm audit).
# body-parser: GHSA-27r3-jxmh-p828; zod: GHSA-mrhx-c7xc-m3w5.
overrides:
  body-parser@<1.20.9: ^1.20.9
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
  zod@<4.6.6: ^4.6.7
